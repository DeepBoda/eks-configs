# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: sandee-frontend
  namespace: sandee
  labels:
    app: sandee-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      name: http
      protocol: TCP
  selector:
    app: sandee-frontend

---
# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: sandee-backend
  namespace: sandee
  labels:
    app: sandee-backend
spec:
  type: ClusterIP
  ports:
    - port: 8008
      targetPort: 8008
      name: http
      protocol: TCP
  selector:
    app: sandee-backend

---
# Admin Service
apiVersion: v1
kind: Service
metadata:
  name: sandee-admin
  namespace: sandee
  labels:
    app: sandee-admin
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
      protocol: TCP
  selector:
    app: sandee-admin

---
# Elasticsearch Service (optional external access)
apiVersion: v1
kind: Service
metadata:
  name: sandee-elasticsearch
  namespace: sandee
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 9200
      name: http
      protocol: TCP
  selector:
    app: elasticsearch

---
# Redis Service (optional external access)
apiVersion: v1
kind: Service
metadata:
  name: sandee-redis
  namespace: sandee
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
      protocol: TCP
  selector:
    app: redis
