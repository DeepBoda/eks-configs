# ALB Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sandee-ingress
  namespace: sandee
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:838645860193:certificate/19f0eb97-784f-4d85-bd1b-c6efabb9d8fa
    alb.ingress.kubernetes.io/ssl-redirect: "443"
spec:
  ingressClassName: alb
  rules:
    - host: eks.sandee.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sandee-frontend
                port:
                  number: 80
    - host: eks-backend.sandee.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sandee-backend
                port:
                  number: 8008
    - host: eks-admin.sandee.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sandee-admin
                port:
                  number: 3000

