---
# Elasticsearch ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: elasticsearch-config
  namespace: sandee
  labels:
    app: elasticsearch
    component: config
data:
  elasticsearch.yml: |
    cluster.name: sandee-elasticsearch
    node.name: ${HOSTNAME}
    node.roles: ["master", "data", "ingest"]
    
    # Network settings
    network.host: 0.0.0.0
    http.port: 9200
    transport.port: 9300
    
    # Discovery settings
    discovery.seed_hosts: ["elasticsearch-0.elasticsearch.sandee.svc.cluster.local", "elasticsearch-1.elasticsearch.sandee.svc.cluster.local", "elasticsearch-2.elasticsearch.sandee.svc.cluster.local"]
    cluster.initial_master_nodes: ["elasticsearch-0", "elasticsearch-1", "elasticsearch-2"]
    
    # Memory settings
    bootstrap.memory_lock: false
    
    # Security settings
    xpack.security.enabled: true
    xpack.security.transport.ssl.enabled: false
    xpack.security.http.ssl.enabled: false
    
    # Performance settings
    thread_pool.write.queue_size: 1000
    thread_pool.search.queue_size: 1000
    indices.memory.index_buffer_size: 20%
    indices.queries.cache.size: 20%
    indices.fielddata.cache.size: 40%
    
    # Logging
    logger.level: INFO
    
    # Index settings
    action.auto_create_index: true
    action.destructive_requires_name: true
    
    # Cluster settings
    cluster.routing.allocation.disk.threshold_enabled: true
    cluster.routing.allocation.disk.watermark.low: 85%
    cluster.routing.allocation.disk.watermark.high: 90%
    cluster.routing.allocation.disk.watermark.flood_stage: 95%
    
    # Gateway settings
    gateway.recover_after_nodes: 2
    gateway.expected_nodes: 3
    gateway.recover_after_time: 5m
  
  jvm.options: |
    # Xms represents the initial size of total heap space
    # Xmx represents the maximum size of total heap space
    -Xms2g
    -Xmx2g
    
    # GC configuration
    -XX:+UseG1GC
    -XX:G1HeapRegionSize=32m
    -XX:+UseG1GC
    -XX:+UnlockExperimentalVMOptions
    -XX:+UseCGroupMemoryLimitForHeap
    -XX:MaxGCPauseMillis=200
    -XX:+DisableExplicitGC
    
    # JVM temporary directory
    -Djava.io.tmpdir=${ES_TMPDIR}
    
    # heap dumps
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:HeapDumpPath=/usr/share/elasticsearch/data
    
    # GC logging
    -Xlog:gc*,gc+age=trace,safepoint:gc.log:utctime,pid,tid,level
    -Xlog:gc+heap=debug:gc.log:utctime,pid,tid,level
    
    # JVM fatal error logs
    -XX:ErrorFile=/usr/share/elasticsearch/logs/hs_err_pid%p.log
    
    # Security manager
    -Djava.security.policy=file:///usr/share/elasticsearch/config/elasticsearch.policy
    
    # Performance
    -Dfile.encoding=UTF-8
    -Djava.awt.headless=true
    -Djna.nosys=true
    -Djdk.io.permissionsUseCanonicalPath=true
    -Dio.netty.noUnsafe=true
    -Dio.netty.noKeySetOptimization=true
    -Dio.netty.recycler.maxCapacityPerThread=0
    -Dlog4j.shutdownHookEnabled=false
    -Dlog4j2.disable.jmx=true
---
# Elasticsearch Secret
apiVersion: v1
kind: Secret
metadata:
  name: elasticsearch-secret
  namespace: sandee
  labels:
    app: elasticsearch
type: Opaque
data:
  elastic-password: RWxhc3RpY1N0cm9uZ1Bhc3N3b3JkMTIzIQ==  # ElasticStrongPassword123!
---
# Elasticsearch Service (Headless)
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: sandee
  labels:
    app: elasticsearch
    component: service
spec:
  clusterIP: None
  ports:
  - port: 9200
    targetPort: 9200
    name: http
  - port: 9300
    targetPort: 9300
    name: transport
  selector:
    app: elasticsearch
---
# Elasticsearch Service (ClusterIP for external access)
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-service
  namespace: sandee
  labels:
    app: elasticsearch
    component: external-service
spec:
  type: ClusterIP
  ports:
  - port: 9200
    targetPort: 9200
    name: http
  selector:
    app: elasticsearch
---
# Elasticsearch StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: sandee
  labels:
    app: elasticsearch
    component: database
spec:
  serviceName: elasticsearch
  replicas: 3
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
        component: database
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9200"
        prometheus.io/path: "/_prometheus/metrics"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - elasticsearch
            topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - elasticsearch
              topologyKey: topology.kubernetes.io/zone
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                - m5.large
                - m5.xlarge
                - m5.2xlarge
                - r5.large
                - r5.xlarge
          - weight: 50
            preference:
              matchExpressions:
              - key: elasticsearch-node
                operator: In
                values:
                - "true"
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: elasticsearch
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: init-sysctl
        image: busybox:1.37
        command:
        - sh
        - -c
        - |
          sysctl -w vm.max_map_count=262144
          chown -R 1000:1000 /usr/share/elasticsearch/data
          chmod 755 /usr/share/elasticsearch/data
        securityContext:
          privileged: true
          runAsUser: 0
        volumeMounts:
        - name: elasticsearch-data
          mountPath: /usr/share/elasticsearch/data
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:9.1.2
        ports:
        - containerPort: 9200
          name: http
          protocol: TCP
        - containerPort: 9300
          name: transport
          protocol: TCP
        env:
        - name: ELASTIC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: elasticsearch-secret
              key: elastic-password
        - name: ES_JAVA_OPTS
          value: "-Xms2g -Xmx2g"
        - name: ES_TMPDIR
          value: "/tmp"
        volumeMounts:
        - name: elasticsearch-data
          mountPath: /usr/share/elasticsearch/data
        - name: elasticsearch-config
          mountPath: /usr/share/elasticsearch/config/elasticsearch.yml
          subPath: elasticsearch.yml
        - name: elasticsearch-config
          mountPath: /usr/share/elasticsearch/config/jvm.options
          subPath: jvm.options
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            memory: "4Gi"
            cpu: "1"
          limits:
            memory: "8Gi"
            cpu: "2"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        livenessProbe:
          httpGet:
            path: /_cluster/health?local=true
            port: 9200
            httpHeaders:
            - name: Authorization
              value: "Basic ZWxhc3RpYzpFbGFzdGljU3Ryb25nUGFzc3dvcmQxMjMh"  # elastic:ElasticStrongPassword123!
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /_cluster/health?wait_for_status=yellow&timeout=5s
            port: 9200
            httpHeaders:
            - name: Authorization
              value: "Basic ZWxhc3RpYzpFbGFzdGljU3Ryb25nUGFzc3dvcmQxMjMh"  # elastic:ElasticStrongPassword123!
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /_cluster/health?local=true
            port: 9200
            httpHeaders:
            - name: Authorization
              value: "Basic ZWxhc3RpYzpFbGFzdGljU3Ryb25nUGFzc3dvcmQxMjMh"  # elastic:ElasticStrongPassword123!
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
      volumes:
      - name: elasticsearch-config
        configMap:
          name: elasticsearch-config
          defaultMode: 0644
      - name: tmp
        emptyDir: {}
      terminationGracePeriodSeconds: 120
      nodeSelector:
        kubernetes.io/os: linux
  volumeClaimTemplates:
  - metadata:
      name: elasticsearch-data
      labels:
        app: elasticsearch
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: gp3-elasticsearch-fast
      resources:
        requests:
          storage: 50Gi
---
# Elasticsearch PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: elasticsearch-pdb
  namespace: sandee
  labels:
    app: elasticsearch
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: elasticsearch
