# Redis Stack - Fast, Persistent, No Password
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: sandee
  labels:
    app: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis/redis-stack-server:7.2.0-v18
        ports:
        - containerPort: 6379
        command: 
        - redis-server
        - --protected-mode
        - "no"
        - --appendonly
        - "yes"
        - --save
        - "60 1000"
        - --maxmemory
        - "1500mb"
        - --maxmemory-policy
        - "allkeys-lru"
        - --io-threads
        - "4"
        - --io-threads-do-reads
        - "yes"
        volumeMounts:
        - name: redis-data
          mountPath: /data
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 10
          periodSeconds: 5
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 3
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: gp2
      resources:
        requests:
          storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: sandee
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis