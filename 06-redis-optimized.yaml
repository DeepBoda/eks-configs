---
# High-Performance Redis Storage Class
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: redis-high-performance
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  fsType: ext4
  iops: "6000"
  throughput: "250"
  encrypted: "true"
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
# Redis ConfigMap - Optimized for Speed & Persistence
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: sandee
  labels:
    app: redis
    component: config
data:
  redis.conf: |
    # Network
    bind 0.0.0.0
    protected-mode yes
    # Password configured via environment variable
    port 6379
    tcp-backlog 2048
    tcp-keepalive 60
    
    # Redis Stack modules
    loadmodule /opt/redis-stack/lib/rediscompat.so
    loadmodule /opt/redis-stack/lib/redisearch.so
    loadmodule /opt/redis-stack/lib/redistimeseries.so
    loadmodule /opt/redis-stack/lib/rejson.so
    loadmodule /opt/redis-stack/lib/redisbloom.so
    
    # Memory Management - Optimized
    maxmemory 5gb
    maxmemory-policy volatile-lru
    maxmemory-samples 10
    
    # Persistence - Dual RDB + AOF
    save 60 1000
    save 300 100
    save 900 1
    rdbcompression yes
    rdbchecksum yes
    dbfilename dump.rdb
    dir /data
    
    # AOF Configuration
    appendonly yes
    appendfilename "appendonly.aof"
    appendfsync everysec
    no-appendfsync-on-rewrite yes
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    aof-load-truncated yes
    aof-use-rdb-preamble yes
    
    # Performance Optimizations
    io-threads 8
    io-threads-do-reads yes
    hz 100
    dynamic-hz yes
    
    # Logging
    loglevel notice
    logfile "/data/redis.log"
    
    # Slow Log
    slowlog-log-slower-than 10000
    slowlog-max-len 2048
    
    # Latency Monitoring
    latency-monitor-threshold 100
    
    # Lazy Freeing
    lazyfree-lazy-eviction yes
    lazyfree-lazy-expire yes
    lazyfree-lazy-server-del yes
    replica-lazy-flush yes
    
    # Client Output Buffers
    client-output-buffer-limit normal 0 0 0
    client-output-buffer-limit replica 256mb 64mb 60
    client-output-buffer-limit pubsub 32mb 8mb 60
    
    # Security
    rename-command FLUSHDB ""
    rename-command FLUSHALL ""
    rename-command CONFIG "CONFIG_b835729c9c774d83a7d82b5bb3d0a7ca"
    
    # Advanced
    stop-writes-on-bgsave-error yes
    hash-max-ziplist-entries 512
    hash-max-ziplist-value 64
    list-max-ziplist-size -2
    set-max-intset-entries 512
    zset-max-ziplist-entries 128
    zset-max-ziplist-value 64
---
# Redis Secret
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: sandee
  labels:
    app: redis
type: Opaque
data:
  redis-password: UmVkaXNTdHJvbmdQYXNzd29yZDEyMyE=  # RedisStrongPassword123!
---
# Redis StatefulSet - High Performance
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: sandee
  labels:
    app: redis
    component: database
spec:
  serviceName: redis
  replicas: 3
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        component: database
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "6379"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - redis
            topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - redis
              topologyKey: topology.kubernetes.io/zone
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                - m6i.large
                - m6i.xlarge
                - m6i.2xlarge
                - m6i.4xlarge
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: redis
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: redis
        image: redis/redis-stack-server:7.2.0-v18
        ports:
        - containerPort: 6379
          name: redis
          protocol: TCP
        command:
        - redis-server
        - /usr/local/etc/redis/redis.conf
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: redis-password
        volumeMounts:
        - name: redis-data
          mountPath: /data
        - name: redis-config
          mountPath: /usr/local/etc/redis/redis.conf
          subPath: redis.conf
        resources:
          requests:
            memory: "4Gi"
            cpu: "1"
          limits:
            memory: "8Gi"
            cpu: "2"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli -a $REDIS_PASSWORD ping
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli -a $REDIS_PASSWORD ping
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli -a $REDIS_PASSWORD ping
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
      volumes:
      - name: redis-config
        configMap:
          name: redis-config
          defaultMode: 0644
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/os: linux
  volumeClaimTemplates:
  - metadata:
      name: redis-data
      labels:
        app: redis
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: redis-high-performance
      resources:
        requests:
          storage: 50Gi
---
# Redis Service (Headless for StatefulSet)
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: sandee
  labels:
    app: redis
    component: service
spec:
  clusterIP: None
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  selector:
    app: redis
---
# Redis Service (ClusterIP for external access)
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: sandee
  labels:
    app: redis
    component: external-service
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  selector:
    app: redis
---
# Redis PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  namespace: sandee
  labels:
    app: redis
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: redis