# Pod Disruption Budgets for High Availability
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sandee-frontend-pdb
  namespace: sandee
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sandee-frontend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sandee-backend-pdb
  namespace: sandee
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: sandee-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sandee-admin-pdb
  namespace: sandee
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sandee-admin
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  namespace: sandee
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: redis
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: elasticsearch-pdb
  namespace: sandee
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: elasticsearch