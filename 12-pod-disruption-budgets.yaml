---
# Frontend PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sandee-frontend-pdb
  namespace: sandee
  labels:
    app: sandee-frontend
    component: availability
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sandee-frontend
---
# Backend PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sandee-backend-pdb
  namespace: sandee
  labels:
    app: sandee-backend
    component: availability
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: sandee-backend
---
# Admin PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sandee-admin-pdb
  namespace: sandee
  labels:
    app: sandee-admin
    component: availability
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sandee-admin
