---
# Services
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: sandee-production
spec:
  selector:
    app: redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
  - name: redisinsight
    port: 8001
    targetPort: 8001
---

apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: sandee-production
spec:
  selector:
    app: elasticsearch
  ports:
  - name: http
    port: 9200
    targetPort: 9200
  - name: transport
    port: 9300
    targetPort: 9300
---
apiVersion: v1
kind: Service
metadata:
  name: sandee-frontend
  namespace: sandee-production
spec:
  selector:
    app: sandee-frontend
  ports:
  - port: 80
    targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: sandee-backend
  namespace: sandee-production
spec:
  selector:
    app: sandee-backend
  ports:
  - port: 8008
    targetPort: 8008
---
