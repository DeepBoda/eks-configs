# Production Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: sandee-production
  labels:
    name: sandee-production
---
# GP3 Storage Classes
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-production
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  iops: "4000"
  throughput: "250"
  fsType: ext4
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
---
# Redis Stack - High Performance Configuration
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: sandee-production
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis/redis-stack:latest
        ports:
        - containerPort: 6379
        - containerPort: 8001
        env:
        - name: REDIS_ARGS
          value: "--appendonly yes --maxmemory 12gb --maxmemory-policy volatile-lru --bind 0.0.0.0 --protected-mode no --maxclients 100000 --tcp-keepalive 60 --timeout 300"
        resources:
          requests:
            cpu: 3000m
            memory: 12Gi
          limits:
            cpu: 6000m
            memory: 16Gi
        volumeMounts:
        - name: redis-data
          mountPath: /data
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 10
          periodSeconds: 3
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 2
          periodSeconds: 1
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: gp3-production
      resources:
        requests:
          storage: 200Gi
---
# Elasticsearch StatefulSet - High Performance
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: sandee-production
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
        env:
        - name: discovery.type
          value: single-node
        - name: xpack.security.enabled
          value: "false"
        - name: ES_JAVA_OPTS
          value: "-Xms6g -Xmx6g"
        - name: thread_pool.search.size
          value: "30"
        - name: thread_pool.search.queue_size
          value: "10000"
        ports:
        - containerPort: 9200
        - containerPort: 9300
        resources:
          requests:
            cpu: 3000m
            memory: 6Gi
          limits:
            cpu: 6000m
            memory: 8Gi
        volumeMounts:
        - name: es-data
          mountPath: /usr/share/elasticsearch/data
        livenessProbe:
          httpGet:
            path: /_cluster/health
            port: 9200
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /_cluster/health
            port: 9200
          initialDelaySeconds: 30
          periodSeconds: 10
  volumeClaimTemplates:
  - metadata:
      name: es-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: gp3-production
      resources:
        requests:
          storage: 50Gi
---
# Frontend Deployment - High Performance
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandee-frontend
  namespace: sandee-production
spec:
  replicas: 10
  selector:
    matchLabels:
      app: sandee-frontend
  template:
    metadata:
      labels:
        app: sandee-frontend
    spec:
      containers:
      - name: frontend
        image: 838645860193.dkr.ecr.us-east-1.amazonaws.com/frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_DEV_BASE_URL
          value: "http://sandee-backend:8008"
        - name: NODE_OPTIONS
          value: "--max-old-space-size=2048"
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 3Gi
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 60
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
---
# Backend Deployment - High Performance
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandee-backend
  namespace: sandee-production
spec:
  replicas: 15
  selector:
    matchLabels:
      app: sandee-backend
  template:
    metadata:
      labels:
        app: sandee-backend
    spec:
      containers:
      - name: backend
        image: 838645860193.dkr.ecr.us-east-1.amazonaws.com/backend:latest
        ports:
        - containerPort: 8008
        env:
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: REDIS_MASTER_URL
          value: "redis://redis:6379"
        - name: ELASTIC_URL
          value: "http://10.100.230.218:9200"
        - name: NODE_OPTIONS
          value: "--max-old-space-size=4096"
        - name: UV_THREADPOOL_SIZE
          value: "128"
        - name: DB_POOL_MIN
          value: "10"
        - name: DB_POOL_MAX
          value: "50"
        resources:
          requests:
            cpu: 1500m
            memory: 3Gi
          limits:
            cpu: 3000m
            memory: 4Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8008
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8008
          initialDelaySeconds: 10
          periodSeconds: 10

---
# Admin Deployment - Optimized
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandee-admin
  namespace: sandee-production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sandee-admin
  template:
    metadata:
      labels:
        app: sandee-admin
    spec:
      containers:
      - name: admin
        image: 838645860193.dkr.ecr.us-east-1.amazonaws.com/admin:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_OPTIONS
          value: "--max-old-space-size=1024"
        resources:
          requests:
            cpu: 1000m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 2Gi
---
# Services
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: sandee-production
spec:
  selector:
    app: redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
  - name: redisinsight
    port: 8001
    targetPort: 8001
---

apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: sandee-production
spec:
  selector:
    app: elasticsearch
  ports:
  - name: http
    port: 9200
    targetPort: 9200
  - name: transport
    port: 9300
    targetPort: 9300
---
apiVersion: v1
kind: Service
metadata:
  name: sandee-frontend
  namespace: sandee-production
spec:
  selector:
    app: sandee-frontend
  ports:
  - port: 80
    targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: sandee-backend
  namespace: sandee-production
spec:
  selector:
    app: sandee-backend
  ports:
  - port: 8008
    targetPort: 8008
---
apiVersion: v1
kind: Service
metadata:
  name: sandee-admin
  namespace: sandee-production
spec:
  selector:
    app: sandee-admin
  ports:
  - port: 3000
    targetPort: 3000
---
# Frontend ALB Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sandee-frontend-ingress
  namespace: sandee-production
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:838645860193:certificate/19f0eb97-784f-4d85-bd1b-c6efabb9d8fa"
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/actions.redirect-www: |
      {
        "type": "redirect",
        "redirectConfig": {
          "protocol": "HTTPS",
          "port": "443",
          "host": "eks.sandee.com",
          "statusCode": "HTTP_301"
        }
      }
spec:
  ingressClassName: alb
  rules:
  - host: eks.sandee.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sandee-frontend
            port:
              number: 80
  - host: www-eks.sandee.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: redirect-www
            port:
              name: use-annotation
---
# Backend ALB with SSL
apiVersion: v1
kind: Service
metadata:
  name: sandee-backend-lb
  namespace: sandee-production
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:us-east-1:838645860193:certificate/19f0eb97-784f-4d85-bd1b-c6efabb9d8fa"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "https"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: 8008
    protocol: TCP
  - name: https
    port: 443
    targetPort: 8008
    protocol: TCP
  selector:
    app: sandee-backend
