apiVersion: v1
kind: Namespace
metadata:
  name: sandee-production
---
# GP3 Storage Class
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-production
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  iops: "5000"
  throughput: "250"
  fsType: ext4
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
---
# Redis Cluster - ORIGINAL WORKING CONFIG
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: sandee-production
spec:
  serviceName: redis
  replicas: 3
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: redis
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: redis
        image: redis/redis-stack:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities: { drop: ["ALL"] }
        ports:
        - containerPort: 6379
        - containerPort: 8001
        env:
        - name: REDIS_ARGS
          value: "--appendonly yes --maxmemory 6gb --maxmemory-policy noeviction --bind 0.0.0.0 --protected-mode no --maxclients 100000 --appendfsync no --save 900 1"
        resources:
          requests:
            cpu: 500m
            memory: 5Gi
          limits:
            cpu: "2"
            memory: 8Gi
        volumeMounts:
        - name: redis-data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - -c
              - |
                redis-cli config set appendfsync everysec
                redis-cli bgsave
                sleep 5
        livenessProbe:
          exec: { command: ["redis-cli", "ping"] }
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          exec: { command: ["redis-cli", "ping"] }
          initialDelaySeconds: 10
          periodSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: gp3-production
      resources:
        requests:
          storage: 100Gi
---
# Elasticsearch - Optimized for m6i.xlarge
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: sandee-production
  labels:
    app: elasticsearch
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9200"
    spec:
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
      - name: increase-vm-max-map-count
        image: busybox:1.36
        command: ["sysctl", "-w", "vm.max_map_count=262144"]
        securityContext:
          privileged: true
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
        ports:
        - containerPort: 9200
        - containerPort: 9300
        env:
        - name: cluster.name
          value: "sandee-es-cluster"
        - name: node.name
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: discovery.type
          value: "single-node"
        - name: xpack.security.enabled
          value: "false"
        - name: ES_JAVA_OPTS
          value: "-Xms3g -Xmx3g"
        - name: index.number_of_replicas
          value: "0"
        volumeMounts:
        - name: es-data
          mountPath: /usr/share/elasticsearch/data
        - name: tmp
          mountPath: /tmp
        livenessProbe:
          httpGet: { path: /_cluster/health, port: 9200 }
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet: { path: /_cluster/health, port: 9200 }
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
  volumeClaimTemplates:
  - metadata:
      name: es-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: gp3-simple
      resources:
        requests:
          storage: 30Gi
---
# High-Performance Frontend Deployment - Optimized for Scale and Speed
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandee-frontend
  namespace: sandee-production
  labels:
    app: sandee-frontend
    component: frontend
    performance-tier: ultra
spec:
  replicas: 9  # Optimized for m6i.xlarge cluster
  revisionHistoryLimit: 3  # Reduced for efficiency
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%  # Increased from 25% for faster deployments
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sandee-frontend
  template:
    metadata:
      labels:
        app: sandee-frontend
        component: frontend
        performance-tier: ultra
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30  # Reduced from 45 for faster scaling
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule  # Stronger constraint for better distribution
        labelSelector:
          matchLabels:
            app: sandee-frontend
      - maxSkew: 2
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: sandee-frontend
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: sandee-frontend
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values: ["m6i.xlarge", "m6i.2xlarge", "m6i.4xlarge"]
      containers:
      - name: frontend
        image: 838645860193.dkr.ecr.us-east-1.amazonaws.com/frontend:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: NEXT_PUBLIC_DEV_BASE_URL
          value: "http://sandee-backend:8008"
        - name: NODE_OPTIONS
          value: "--max-old-space-size=1200"  # Optimized for 1.5Gi container (leave 300MB for system)
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: NEXT_TELEMETRY_DISABLED
          value: "1"
        - name: UV_THREADPOOL_SIZE
          value: "16"  # Increased thread pool for better I/O performance
        resources:
          requests:
            cpu: 300m
            memory: 800Mi
          limits:
            cpu: 600m
            memory: 1200Mi
        lifecycle:
          preStop:
            exec: { command: ["sh", "-c", "sleep 5"] }  # Reduced for faster scaling
        startupProbe:
          httpGet:
            path: /health
            port: 3000
            httpHeaders:
            - name: User-Agent
              value: "k8s-startup-probe"
          failureThreshold: 20  # Reduced from 30
          periodSeconds: 2
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
            httpHeaders:
            - name: User-Agent
              value: "k8s-liveness-probe"
          initialDelaySeconds: 30  # Reduced from 40
          periodSeconds: 15        # Reduced from 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
            httpHeaders:
            - name: User-Agent
              value: "k8s-readiness-probe"
          initialDelaySeconds: 5   # Faster readiness detection
          periodSeconds: 3         # More frequent checks
          timeoutSeconds: 2
          failureThreshold: 2
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: nextjs-cache
          mountPath: /.next
        - name: npm-cache
          mountPath: /.npm
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      - name: nextjs-cache
        emptyDir:
          sizeLimit: 2Gi
      - name: npm-cache
        emptyDir:
          sizeLimit: 500Mi
      dnsPolicy: ClusterFirst
      restartPolicy: Always
---
# High-Performance Backend Deployment - Optimized for Maximum Throughput
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandee-backend
  namespace: sandee-production
  labels:
    app: sandee-backend
    component: backend
    performance-tier: ultra
spec:
  replicas: 9
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%  # Reduced from 100% to prevent CPU exhaustion during deployments
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sandee-backend
  template:
    metadata:
      labels:
        app: sandee-backend
        component: backend
        performance-tier: ultra
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8008"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30  # Reduced for faster scaling
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule  # Stronger constraint
        labelSelector:
          matchLabels:
            app: sandee-backend
      - maxSkew: 2
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: sandee-backend
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: sandee-backend
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values: ["m6i.xlarge", "m6i.2xlarge", "m6i.4xlarge"]
      containers:
      - name: backend
        image: 838645860193.dkr.ecr.us-east-1.amazonaws.com/backend:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
        ports:
        - containerPort: 8008
          name: http
          protocol: TCP
        env:
        - name: REDIS_URL
          value: redis://redis:6379
        - name: REDIS_MASTER_URL
          value: redis://redis:6379
        - name: REDIS_CLUSTER_NODES
          value: redis-0.redis.sandee-production.svc.cluster.local:6379,redis-1.redis.sandee-production.svc.cluster.local:6379,redis-2.redis.sandee-production.svc.cluster.local:6379,redis-3.redis.sandee-production.svc.cluster.local:6379,redis-4.redis.sandee-production.svc.cluster.local:6379,redis-5.redis.sandee-production.svc.cluster.local:6379
        - name: ELASTIC_URL
          value: http://elasticsearch:9200
        - name: ELASTICSEARCH_NODES
          value: "http://elasticsearch-0.elasticsearch.sandee-production.svc.cluster.local:9200"
        - name: NODE_OPTIONS
          value: "--max-old-space-size=1700"  # Optimized for 2Gi container (leave 300MB for system)
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "8008"
        - name: UV_THREADPOOL_SIZE
          value: "32"  # Increased for better I/O performance
        - name: REDIS_POOL_SIZE
          value: "30"  # Increased for better Redis performance
        - name: ELASTICSEARCH_POOL_SIZE
          value: "25"  # Increased for better search performance
        - name: REQUEST_TIMEOUT
          value: "30000"
        - name: KEEP_ALIVE_TIMEOUT
          value: "65000"
        resources:
          requests:
            cpu: 600m
            memory: 1500Mi
          limits:
            cpu: "1"
            memory: 2500Mi
        lifecycle:
          preStop:
            exec: { command: ["sh", "-c", "sleep 5"] }  # Reduced for faster scaling
        startupProbe:
          httpGet:
            path: /health
            port: 8008
            httpHeaders:
            - name: User-Agent
              value: "k8s-startup-probe"
          failureThreshold: 20  # Reduced from 30
          periodSeconds: 2
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8008
            httpHeaders:
            - name: User-Agent
              value: "k8s-liveness-probe"
          initialDelaySeconds: 30  # Reduced from 40
          periodSeconds: 15        # Reduced from 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8008
            httpHeaders:
            - name: User-Agent
              value: "k8s-readiness-probe"
          initialDelaySeconds: 3   # Faster readiness detection
          periodSeconds: 2         # More frequent checks
          timeoutSeconds: 2
          failureThreshold: 2
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: app-cache
          mountPath: /app/cache
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      - name: app-cache
        emptyDir:
          sizeLimit: 2Gi
      - name: logs
        emptyDir:
          sizeLimit: 500Mi
      dnsPolicy: ClusterFirst
      restartPolicy: Always
---
# High-Performance Services - Optimized for Load Balancing and Session Affinity
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: sandee-production
  labels:
    app: redis
    component: cache
    performance-tier: ultra
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "alb"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
spec:
  type: ClusterIP
  selector:
    app: redis
  sessionAffinity: ClientIP  # Enable session affinity for Redis connections
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600  # 1 hour session stickiness
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
    protocol: TCP
  - name: redisinsight
    port: 8001
    targetPort: 8001
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: sandee-production
  labels:
    app: elasticsearch
    component: search
    performance-tier: ultra
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "alb"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
spec:
  type: ClusterIP
  selector:
    app: elasticsearch
  ports:
  - name: http
    port: 9200
    targetPort: 9200
    protocol: TCP
  - name: transport
    port: 9300
    targetPort: 9300
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: sandee-frontend
  namespace: sandee-production
  labels:
    app: sandee-frontend
    component: frontend
    performance-tier: ultra
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "alb"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
    service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: "60"
spec:
  type: ClusterIP
  selector:
    app: sandee-frontend
  sessionAffinity: None  # No session affinity for frontend (stateless)
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: sandee-backend
  namespace: sandee-production
  labels:
    app: sandee-backend
    component: backend
    performance-tier: ultra
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "alb"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
    service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: "300"
spec:
  type: ClusterIP
  selector:
    app: sandee-backend
  sessionAffinity: None  # No session affinity for backend (stateless)
  ports:
  - name: http
    port: 8008
    targetPort: 8008
    protocol: TCP
---
# High-Performance Frontend Ingress - Optimized for Speed and Scale
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sandee-frontend-ingress
  namespace: sandee-production
  labels:
    app: sandee-frontend
    component: ingress
    performance-tier: ultra
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:838645860193:certificate/19f0eb97-784f-4d85-bd1b-c6efabb9d8fa"
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/load-balancer-attributes: |
      routing.http2.enabled=true,
      idle_timeout.timeout_seconds=300
    alb.ingress.kubernetes.io/compression: 'true'
    alb.ingress.kubernetes.io/target-group-attributes: |
      stickiness.enabled=false,
      stickiness.type=lb_cookie,
      stickiness.lb_cookie.duration_seconds=86400,
      slow_start.duration_seconds=30,
      deregistration_delay.timeout_seconds=30
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    alb.ingress.kubernetes.io/success-codes: "200,301,302"
    alb.ingress.kubernetes.io/actions.redirect-to-non-www: |
      {
        "type": "redirect",
        "redirectConfig": {
          "protocol": "HTTPS",
          "port": "443",
          "host": "sandee.com",
          "statusCode": "HTTP_301"
        }
      }
spec:
  ingressClassName: alb
  rules:
  - host: sandee.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sandee-frontend
            port:
              number: 80
  - host: www.sandee.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: redirect-to-non-www
            port:
              name: use-annotation
---
# High-Performance Backend Ingress - Optimized for API Throughput
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sandee-backend-ingress
  namespace: sandee-production
  labels:
    app: sandee-backend
    component: ingress
    performance-tier: ultra
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:838645860193:certificate/19f0eb97-784f-4d85-bd1b-c6efabb9d8fa"
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/load-balancer-attributes: |
      routing.http2.enabled=true,
      idle_timeout.timeout_seconds=300
    alb.ingress.kubernetes.io/target-group-attributes: |
      stickiness.enabled=false,
      slow_start.duration_seconds=30,
      deregistration_delay.timeout_seconds=30
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "3"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    alb.ingress.kubernetes.io/success-codes: "200,201,202"
    alb.ingress.kubernetes.io/compression: 'true'
spec:
  ingressClassName: alb
  rules:
  - host: backend-v2.sandee.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sandee-backend
            port:
              number: 8008
---
# Ultra-Responsive HPA Configurations - Optimized for Unlimited Scale
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sandee-frontend-hpa
  namespace: sandee-production
  labels:
    app: sandee-frontend
    component: autoscaling
    performance-tier: ultra
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sandee-frontend
  minReplicas: 9
  maxReplicas: 15
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 35  # Lower threshold for proactive scaling
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 50  # Lower threshold for memory-based scaling
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 5   # Reduced from 15 for ultra-fast scaling
      policies:
      - type: Percent
        value: 300  # Increased from 100 for aggressive scaling
        periodSeconds: 5   # Reduced from 15
      - type: Pods
        value: 10  # Add absolute pod scaling
        periodSeconds: 5
      selectPolicy: Max  # Use the most aggressive policy
    scaleDown:
      stabilizationWindowSeconds: 120  # Reduced from 300 but still stable
      policies:
      - type: Percent
        value: 25   # Conservative scale down
        periodSeconds: 30  # Reduced from 60
      - type: Pods
        value: 3    # Reduced from 5 for smoother scale down
        periodSeconds: 30
      selectPolicy: Min  # Use the most conservative policy
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sandee-backend-hpa
  namespace: sandee-production
  labels:
    app: sandee-backend
    component: autoscaling
    performance-tier: ultra
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sandee-backend
  minReplicas: 9
  maxReplicas: 15
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 30  # Lower threshold for proactive scaling
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 50  # Lower threshold for memory-based scaling
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 5   # Ultra-fast scaling
      policies:
      - type: Percent
        value: 400  # Very aggressive scaling for backend
        periodSeconds: 5
      - type: Pods
        value: 15   # High absolute pod scaling
        periodSeconds: 5
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
      - type: Percent
        value: 20   # More conservative for backend stability
        periodSeconds: 30
      - type: Pods
        value: 2    # Smaller pod decrements
        periodSeconds: 30
      selectPolicy: Min
---
# High-Availability Pod Disruption Budgets - Optimized for Zero-Downtime Operations
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  namespace: sandee-production
  labels:
    app: redis
    component: cache
    performance-tier: ultra
spec:
  maxUnavailable: 1  # Updated for 3 replicas
  selector:
    matchLabels:
      app: redis
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: elasticsearch-pdb
  namespace: sandee-production
