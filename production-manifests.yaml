  replicas: 6
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 100%  # Increased for faster deployments
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sandee-backend
  template:
    metadata:
      labels:
        app: sandee-backend
        component: backend
        performance-tier: ultra
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8008"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30  # Reduced for faster scaling
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule  # Stronger constraint
        labelSelector:
          matchLabels:
            app: sandee-backend
      - maxSkew: 2
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: sandee-backend
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: sandee-backend
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values: ["m6i.xlarge", "m6i.2xlarge", "m6i.4xlarge"]
      containers:
      - name: backend
        image: 838645860193.dkr.ecr.us-east-1.amazonaws.com/backend:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
        ports:
        - containerPort: 8008
          name: http
          protocol: TCP
        env:
        - name: REDIS_URL
          value: redis://redis:6379
        - name: REDIS_MASTER_URL
          value: redis://redis:6379
        - name: REDIS_CLUSTER_NODES
          value: redis-0.redis.sandee-production.svc.cluster.local:6379,redis-1.redis.sandee-production.svc.cluster.local:6379,redis-2.redis.sandee-production.svc.cluster.local:6379
        - name: ELASTIC_URL
          value: http://elasticsearch:9200
        - name: ELASTICSEARCH_NODES
          value: "http://elasticsearch-0.elasticsearch.sandee-production.svc.cluster.local:9200,http://elasticsearch-1.elasticsearch.sandee-production.svc.cluster.local:9200,http://elasticsearch-2.elasticsearch.sandee-production.svc.cluster.local:9200"
        - name: NODE_OPTIONS
          value: "--max-old-space-size=2048"  # Restored to working value for stability
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "8008"
        - name: UV_THREADPOOL_SIZE
          value: "32"  # Increased for better I/O performance
        - name: REDIS_POOL_SIZE
          value: "20"  # Connection pool optimization
        - name: ELASTICSEARCH_POOL_SIZE
          value: "15"
        - name: REQUEST_TIMEOUT
          value: "30000"
        - name: KEEP_ALIVE_TIMEOUT
          value: "65000"
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 2Gi
        lifecycle:
          preStop:
            exec: { command: ["sh", "-c", "sleep 5"] }  # Reduced for faster scaling
        startupProbe:
          httpGet:
            path: /health
            port: 8008
            httpHeaders:
            - name: User-Agent
              value: "k8s-startup-probe"
          failureThreshold: 20  # Reduced from 30
          periodSeconds: 2
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8008
            httpHeaders:
            - name: User-Agent
              value: "k8s-liveness-probe"
          initialDelaySeconds: 30  # Reduced from 40
          periodSeconds: 15        # Reduced from 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8008
            httpHeaders:
            - name: User-Agent
              value: "k8s-readiness-probe"
          initialDelaySeconds: 5   # Reduced from 10
          periodSeconds: 3         # Reduced from 5
          timeoutSeconds: 2
          failureThreshold: 2
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: app-cache
          mountPath: /app/cache
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      - name: app-cache
        emptyDir:
          sizeLimit: 2Gi
      - name: logs
        emptyDir:
          sizeLimit: 500Mi
      dnsPolicy: ClusterFirst
      restartPolicy: Always
---
# High-Performance Services - Optimized for Load Balancing and Session Affinity
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: sandee-production
  labels:
    app: redis
    component: cache
    performance-tier: ultra
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "alb"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
spec:
  type: ClusterIP
  selector:
    app: redis
  sessionAffinity: ClientIP  # Enable session affinity for Redis connections
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600  # 1 hour session stickiness
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
    protocol: TCP
  - name: redisinsight
    port: 8001
    targetPort: 8001
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: sandee-production
  labels:
    app: elasticsearch
    component: search
    performance-tier: ultra
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "alb"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
spec:
  type: ClusterIP
  selector:
    app: elasticsearch
  ports:
  - name: http
    port: 9200
    targetPort: 9200
    protocol: TCP
  - name: transport
    port: 9300
    targetPort: 9300
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: sandee-frontend
  namespace: sandee-production
  labels:
    app: sandee-frontend
    component: frontend
    performance-tier: ultra
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "alb"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
    service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: "60"
spec:
  type: ClusterIP
  selector:
    app: sandee-frontend
  sessionAffinity: None  # No session affinity for frontend (stateless)
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: sandee-backend
  namespace: sandee-production
  labels:
    app: sandee-backend
    component: backend
    performance-tier: ultra
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "alb"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
    service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: "300"
spec:
  type: ClusterIP
  selector:
    app: sandee-backend
  sessionAffinity: None  # No session affinity for backend (stateless)
  ports:
  - name: http
    port: 8008
    targetPort: 8008
    protocol: TCP
---
# High-Performance Frontend Ingress - Optimized for Speed and Scale
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sandee-frontend-ingress
  namespace: sandee-production
  labels:
    app: sandee-frontend
    component: ingress
    performance-tier: ultra
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:838645860193:certificate/19f0eb97-784f-4d85-bd1b-c6efabb9d8fa"
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/load-balancer-attributes: |
      routing.http2.enabled=true,
      idle_timeout.timeout_seconds=300
    alb.ingress.kubernetes.io/compression: 'true'
    alb.ingress.kubernetes.io/target-group-attributes: |
      stickiness.enabled=false,
      stickiness.type=lb_cookie,
      stickiness.lb_cookie.duration_seconds=86400,
      load_balancing.algorithm.type=least_outstanding_requests,
      slow_start.duration_seconds=30,
      deregistration_delay.timeout_seconds=30
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    alb.ingress.kubernetes.io/success-codes: "200,301,302"
    alb.ingress.kubernetes.io/actions.redirect-to-non-www: |
      {
        "type": "redirect",
        "redirectConfig": {
          "protocol": "HTTPS",
          "port": "443",
          "host": "sandee.com",
          "statusCode": "HTTP_301"
        }
      }
spec:
  ingressClassName: alb
  rules:
  - host: sandee.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sandee-frontend
            port:
              number: 80
  - host: www.sandee.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: redirect-to-non-www
            port:
              name: use-annotation
---
# High-Performance Backend Ingress - Optimized for API Throughput
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sandee-backend-ingress
  namespace: sandee-production
  labels:
    app: sandee-backend
    component: ingress
    performance-tier: ultra
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:838645860193:certificate/19f0eb97-784f-4d85-bd1b-c6efabb9d8fa"
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/load-balancer-attributes: |
      routing.http2.enabled=true,
      idle_timeout.timeout_seconds=300
    alb.ingress.kubernetes.io/target-group-attributes: |
      stickiness.enabled=false,
      load_balancing.algorithm.type=least_outstanding_requests,
      slow_start.duration_seconds=15,
      deregistration_delay.timeout_seconds=15
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "3"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    alb.ingress.kubernetes.io/success-codes: "200,201,202"
    alb.ingress.kubernetes.io/compression: 'true'
spec:
  ingressClassName: alb
  rules:
  - host: backend-v2.sandee.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sandee-backend
            port:
              number: 8008
---
# Ultra-Responsive HPA Configurations - Optimized for Unlimited Scale
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sandee-frontend-hpa
  namespace: sandee-production
  labels:
    app: sandee-frontend
    component: autoscaling
    performance-tier: ultra
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sandee-frontend
  minReplicas: 8
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 45  # Reduced from 65 for faster response
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 60  # Reduced from 75 for better headroom
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 5   # Reduced from 15 for ultra-fast scaling
      policies:
      - type: Percent
        value: 300  # Increased from 100 for aggressive scaling
        periodSeconds: 5   # Reduced from 15
      - type: Pods
        value: 10  # Add absolute pod scaling
        periodSeconds: 5
      selectPolicy: Max  # Use the most aggressive policy
    scaleDown:
      stabilizationWindowSeconds: 120  # Reduced from 300 but still stable
      policies:
      - type: Percent
        value: 25   # Conservative scale down
        periodSeconds: 30  # Reduced from 60
      - type: Pods
        value: 3    # Reduced from 5 for smoother scale down
        periodSeconds: 30
      selectPolicy: Min  # Use the most conservative policy
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sandee-backend-hpa
  namespace: sandee-production
  labels:
    app: sandee-backend
    component: autoscaling
    performance-tier: ultra
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sandee-backend
  minReplicas: 6
  maxReplicas: 15
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 40  # Reduced from 60 for faster response
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 60  # Reduced from 75 for better headroom
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 5   # Ultra-fast scaling
      policies:
      - type: Percent
        value: 400  # Very aggressive scaling for backend
        periodSeconds: 5
      - type: Pods
        value: 15   # High absolute pod scaling
        periodSeconds: 5
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
      - type: Percent
        value: 20   # More conservative for backend stability
        periodSeconds: 30
      - type: Pods
        value: 2    # Smaller pod decrements
        periodSeconds: 30
      selectPolicy: Min
---
# High-Availability Pod Disruption Budgets - Optimized for Zero-Downtime Operations
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  namespace: sandee-production
  labels:
    app: redis
    component: cache
    performance-tier: ultra
spec:
  maxUnavailable: 1  # Conservative for 3 replicas to maintain quorum
  selector:
    matchLabels:
      app: redis
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: elasticsearch-pdb
  namespace: sandee-production
  labels:
    app: elasticsearch
    component: search
    performance-tier: ultra
spec:
  minAvailable: 2  # Increased from 1 to ensure cluster quorum
  selector:
    matchLabels:
      app: elasticsearch
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: sandee-production
  labels:
    app: sandee-frontend
    component: frontend
    performance-tier: ultra
spec:
  minAvailable: "85%"  # Increased from 80% for better availability
  selector:
    matchLabels:
      app: sandee-frontend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: sandee-production
  labels:
    app: sandee-backend
    component: backend
    performance-tier: ultra
spec:
  minAvailable: "90%"  # Increased from 80% for critical backend availability
  selector:
    matchLabels:
      app: sandee-backend
