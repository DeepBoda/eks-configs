# Production Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: sandee-production
  labels:
    name: sandee-production
---
# GP3 Storage Classes
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-production
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  iops: "4000"
  throughput: "250"
  fsType: ext4
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
---
# Redis Stack Cluster (3 replicas)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: sandee-production
spec:
  serviceName: redis
  replicas: 3
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - redis
              topologyKey: kubernetes.io/hostname
      containers:
      - name: redis
        image: redis/redis-stack:7.4.0-v1
        ports:
        - containerPort: 6379
        - containerPort: 8001
        env:
        - name: REDIS_ARGS
          value: "--appendonly yes --appendfsync no --save '' --maxclients 65000 --tcp-backlog 65535"
        - name: REDISINSIGHT_HOST
          value: "0.0.0.0"
        - name: REDISINSIGHT_PORT
          value: "8001"
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: 1000m
            memory: 3Gi
        volumeMounts:
        - name: redis-data
          mountPath: /data
        - name: redis-config
          mountPath: /usr/local/etc/redis/redis.conf
          subPath: redis.conf
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 10
          periodSeconds: 3
          timeoutSeconds: 1
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 2
          periodSeconds: 1
          timeoutSeconds: 1
        startupProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 1
          failureThreshold: 30
      volumes:
      - name: redis-config
        configMap:
          name: redis-config
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: gp3-production
      resources:
        requests:
          storage: 100Gi
---
# Redis Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: sandee-production
data:
  redis.conf: |
    # Ultra High Performance Config
    maxmemory 3gb
    maxmemory-policy volatile-lru
    
    # Network Optimization
    bind 0.0.0.0
    protected-mode no
    port 6379
    tcp-backlog 65535
    tcp-keepalive 60
    timeout 0
    
    # Connection Limits
    maxclients 65000
    
    # Performance Tuning
    hz 100
    dynamic-hz yes
    
    # Persistence (Optimized for speed)
    appendonly yes
    appendfsync no
    no-appendfsync-on-rewrite yes
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    
    # Disable RDB for max speed
    save ""
    
    # Memory Optimization
    hash-max-ziplist-entries 512
    hash-max-ziplist-value 64
    list-max-ziplist-size -2
    set-max-intset-entries 512
    zset-max-ziplist-entries 128
    zset-max-ziplist-value 64
    
    # Logging
    loglevel warning
    
    # Redis Stack modules
    loadmodule /opt/redis-stack/lib/redisearch.so
    loadmodule /opt/redis-stack/lib/redisgraph.so
    loadmodule /opt/redis-stack/lib/redistimeseries.so
    loadmodule /opt/redis-stack/lib/rejson.so
    loadmodule /opt/redis-stack/lib/redisbloom.so
---
# Elasticsearch StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: sandee-production
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
        env:
        - name: discovery.type
          value: single-node
        - name: xpack.security.enabled
          value: "true"
        - name: ELASTIC_PASSWORD
          value: "sdXBClIwLXjBHveJmqIh"
        - name: ES_JAVA_OPTS
          value: "-Xms1g -Xmx1g"
        ports:
        - containerPort: 9200
        - containerPort: 9300
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        volumeMounts:
        - name: es-data
          mountPath: /usr/share/elasticsearch/data
  volumeClaimTemplates:
  - metadata:
      name: es-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: gp3-production
      resources:
        requests:
          storage: 50Gi
---
# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandee-frontend
  namespace: sandee-production
spec:
  replicas: 5
  selector:
    matchLabels:
      app: sandee-frontend
  template:
    metadata:
      labels:
        app: sandee-frontend
    spec:
      containers:
      - name: frontend
        image: 838645860193.dkr.ecr.us-east-1.amazonaws.com/frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_DEV_BASE_URL
          value: "https://eks-backend.sandee.com"
        resources:
          requests:
            cpu: 1000m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 60
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
---
# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandee-backend
  namespace: sandee-production
spec:
  replicas: 5
  selector:
    matchLabels:
      app: sandee-backend
  template:
    metadata:
      labels:
        app: sandee-backend
    spec:
      containers:
      - name: backend
        image: 838645860193.dkr.ecr.us-east-1.amazonaws.com/backend:latest
        ports:
        - containerPort: 8008
        env:
        - name: REDIS_HOST
          value: "redis.sandee-production.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
        - name: ELASTICSEARCH_URL
          value: "https://elasticsearch:9200"
        - name: ELASTIC_USERNAME
          value: "elastic"
        - name: ELASTIC_PASSWORD
          value: "sdXBClIwLXjBHveJmqIh"
        volumeMounts:
        - name: es-cert
          mountPath: /app/certificate.crt
          subPath: certificate.crt
          readOnly: true
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8008
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8008
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: es-cert
        secret:
          secretName: elasticsearch-cert
