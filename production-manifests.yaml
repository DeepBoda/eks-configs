---
# Services
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: sandee-production
spec:
  selector:
    app: redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
  - name: redisinsight
    port: 8001
    targetPort: 8001
---

apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: sandee-production
spec:
  selector:
    app: elasticsearch
  ports:
  - name: http
    port: 9200
    targetPort: 9200
  - name: transport
    port: 9300
    targetPort: 9300
---
apiVersion: v1
kind: Service
metadata:
  name: sandee-frontend
  namespace: sandee-production
spec:
  selector:
    app: sandee-frontend
  ports:
  - port: 80
    targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: sandee-backend
  namespace: sandee-production
spec:
  selector:
    app: sandee-backend
  ports:
  - port: 8008
    targetPort: 8008
---
# apiVersion: v1
# kind: Service
# metadata:
#   name: sandee-admin
#   namespace: sandee-production
# spec:
#   selector:
#     app: sandee-admin
#   ports:
#   - port: 3000
#     targetPort: 3000
---
# Frontend ALB Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sandee-frontend-ingress
  namespace: sandee-production
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:838645860193:certificate/19f0eb97-784f-4d85-bd1b-c6efabb9d8fa"
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/actions.redirect-www: |
      {
        "type": "redirect",
        "redirectConfig": {
          "protocol": "HTTPS",
          "port": "443",
          "host": "eks.sandee.com",
          "statusCode": "HTTP_301"
        }
      }
spec:
  ingressClassName: alb
  rules:
  - host: eks.sandee.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sandee-frontend
            port:
              number: 80
  - host: www-eks.sandee.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: redirect-www
            port:
              name: use-annotation
---
# Backend ALB with SSL
apiVersion: v1
kind: Service
metadata:
  name: sandee-backend-lb
  namespace: sandee-production
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:us-east-1:838645860193:certificate/19f0eb97-784f-4d85-bd1b-c6efabb9d8fa"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "https"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: 8008
    protocol: TCP
  - name: https
    port: 443
    targetPort: 8008
    protocol: TCP
  selector:
    app: sandee-backend
