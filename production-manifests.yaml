apiVersion: v1
kind: Namespace
metadata:
  name: sandee-production
---
# GP3 Storage Class
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-production
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  iops: "5000"
  throughput: "250"
  fsType: ext4
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
---
# Redis Cluster
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: sandee-production
spec:
  serviceName: redis
  replicas: 3
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: redis
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: redis
        image: redis/redis-stack:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        ports:
        - containerPort: 6379
        - containerPort: 8001
        env:
        - name: REDIS_ARGS
          value: "--appendonly yes --maxmemory 6gb --maxmemory-policy volatile-lru --bind 0.0.0.0 --protected-mode no --maxclients 100000"
        resources:
          requests:
            cpu: 500m
            memory: 5Gi
          limits:
            cpu: "2"
            memory: 8Gi
        volumeMounts:
        - name: redis-data
          mountPath: /data
        livenessProbe:
          exec: { command: ["redis-cli", "ping"] }
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          exec: { command: ["redis-cli", "ping"] }
          initialDelaySeconds: 10
          periodSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: gp3-production
      resources:
        requests:
          storage: 100Gi
---
# Elasticsearch (single node)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: sandee-production
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: increase-vm-max-map-count
        image: busybox
        command: ["sysctl", "-w", "vm.max_map_count=262144"]
        securityContext:
          privileged: true
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        env:
        - name: discovery.type
          value: single-node
        - name: xpack.security.enabled
          value: "false"
        - name: ES_JAVA_OPTS
          value: "-Xms4g -Xmx4g"
        - name: index.number_of_replicas
          value: "0"
        ports:
        - containerPort: 9200
        - containerPort: 9300
        resources:
          requests:
            cpu: 1
            memory: 5Gi
          limits:
            cpu: 2
            memory: 8Gi
        volumeMounts:
        - name: es-data
          mountPath: /usr/share/elasticsearch/data
        livenessProbe:
          httpGet: { path: /_cluster/health, port: 9200 }
          initialDelaySeconds: 90
          periodSeconds: 30
        readinessProbe:
          httpGet: { path: /_cluster/health, port: 9200 }
          initialDelaySeconds: 60
          periodSeconds: 15
  volumeClaimTemplates:
  - metadata:
      name: es-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: gp3-production
      resources:
        requests:
          storage: 100Gi
---
# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandee-frontend
  namespace: sandee-production
spec:
  replicas: 8
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sandee-frontend
  template:
    metadata:
      labels:
        app: sandee-frontend
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: sandee-frontend
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: sandee-frontend
              topologyKey: kubernetes.io/hostname
      containers:
      - name: frontend
        image: 838645860193.dkr.ecr.us-east-1.amazonaws.com/frontend:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_DEV_BASE_URL
          value: "http://sandee-backend:8008"
        - name: NODE_OPTIONS
          value: "--max-old-space-size=2048"
        resources:
          requests:
            cpu: 300m
            memory: 768Mi
          limits:
            cpu: "1"
            memory: 2Gi
        lifecycle:
          preStop:
            exec: { command: ["sh", "-c", "sleep 10"] }
        startupProbe:
          httpGet: { path: /health, port: 3000 }
          failureThreshold: 30
          periodSeconds: 2
        livenessProbe:
          httpGet: { path: /health, port: 3000 }
          initialDelaySeconds: 40
          periodSeconds: 20
        readinessProbe:
          httpGet: { path: /health, port: 3000 }
          initialDelaySeconds: 20
          periodSeconds: 10
---
# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandee-backend
  namespace: sandee-production
spec:
  replicas: 8
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sandee-backend
  template:
    metadata:
      labels:
        app: sandee-backend
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: sandee-backend
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: sandee-backend
              topologyKey: kubernetes.io/hostname
      containers:
      - name: backend
        image: 838645860193.dkr.ecr.us-east-1.amazonaws.com/backend:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        ports:
        - containerPort: 8008
        env:
        - name: REDIS_URL
          value: redis://redis:6379
        - name: REDIS_MASTER_URL
          value: redis://redis:6379
        - name: REDIS_CLUSTER_NODES
          value: redis-0.redis:6379,redis-1.redis:6379,redis-2.redis:6379
        - name: ELASTIC_URL
          value: http://elasticsearch:9200
        - name: NODE_OPTIONS
          value: "--max-old-space-size=2048"
        resources:
          requests:
            cpu: 400m
            memory: 1Gi
          limits:
            cpu: "1500m"
            memory: 3Gi
        lifecycle:
          preStop:
            exec: { command: ["sh", "-c", "sleep 10"] }
        startupProbe:
          httpGet: { path: /health, port: 8008 }
          failureThreshold: 30
          periodSeconds: 2
        livenessProbe:
          httpGet: { path: /health, port: 8008 }
          initialDelaySeconds: 40
          periodSeconds: 20
        readinessProbe:
          httpGet: { path: /health, port: 8008 }
          initialDelaySeconds: 10
          periodSeconds: 5
---
# Services
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: sandee-production
spec:
  selector:
    app: redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
  - name: redisinsight
    port: 8001
    targetPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: sandee-production
spec:
  selector:
    app: elasticsearch
  ports:
  - name: http
    port: 9200
    targetPort: 9200
  - name: transport
    port: 9300
    targetPort: 9300
---
apiVersion: v1
kind: Service
metadata:
  name: sandee-frontend
  namespace: sandee-production
spec:
  selector:
    app: sandee-frontend
  ports:
  - port: 80
    targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: sandee-backend
  namespace: sandee-production
spec:
  selector:
    app: sandee-backend
  ports:
  - port: 8008
    targetPort: 8008
---
# Frontend Ingress (ALB tuned)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sandee-frontend-ingress
  namespace: sandee-production
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:838645860193:certificate/19f0eb97-784f-4d85-bd1b-c6efabb9d8fa"
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/actions.redirect-to-non-www: |
      {
        "type": "redirect",
        "redirectConfig": {
          "protocol": "HTTPS",
          "port": "443",
          "host": "sandee.com",
          "statusCode": "HTTP_301"
        }
      }
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=120
    alb.ingress.kubernetes.io/compression: 'true'
spec:
  ingressClassName: alb
  rules:
  - host: sandee.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sandee-frontend
            port:
              number: 80
  - host: www.sandee.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: redirect-to-non-www
            port:
              name: use-annotation
---
# Backend Ingress (ALB tuned)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sandee-backend-ingress
  namespace: sandee-production
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:838645860193:certificate/19f0eb97-784f-4d85-bd1b-c6efabb9d8fa"
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=120
    alb.ingress.kubernetes.io/compression: 'true'
spec:
  ingressClassName: alb
  rules:
  - host: backend-v2.sandee.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sandee-backend
            port:
              number: 8008
---
# HPAs
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sandee-frontend-hpa
  namespace: sandee-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sandee-frontend
  minReplicas: 8
  maxReplicas: 80
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 65
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 5
        periodSeconds: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sandee-backend-hpa
  namespace: sandee-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sandee-backend
  minReplicas: 8
  maxReplicas: 120
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 5
        periodSeconds: 60
---
# Pod Disruption Budgets
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  namespace: sandee-production
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: redis
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: elasticsearch-pdb
  namespace: sandee-production
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: elasticsearch
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: sandee-production
spec:
  minAvailable: "80%"
  selector:
    matchLabels:
      app: sandee-frontend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: sandee-production
spec:
  minAvailable: "80%"
  selector:
    matchLabels:
      app: sandee-backend
