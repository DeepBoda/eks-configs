apiVersion: v1
kind: Namespace
metadata:
  name: sandee-production
---
# GP3 Storage Class
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-production
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  iops: "5000"
  throughput: "250"
  fsType: ext4
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
---
# Redis Cluster
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: sandee-production
  labels:
    app: redis
spec:
  serviceName: redis
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        component: cache
        performance-tier: ultra
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "6379"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:  # Stronger anti-affinity
          - labelSelector:
              matchLabels:
                app: redis
            topologyKey: kubernetes.io/hostname
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values: ["m6i.xlarge", "m6i.2xlarge", "m6i.4xlarge"]
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: redis
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: redis
        image: redis/redis-stack:7.2.0-v9  # Pinned version for stability
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
          runAsNonRoot: true
          runAsUser: 999
        ports:
        - containerPort: 6379
          name: redis
          protocol: TCP
        - containerPort: 8001
          name: redisinsight
          protocol: TCP
        env:
        - name: REDIS_ARGS
          value: "--appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru"
        - name: REDIS_REPLICATION_MODE
          value: master
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 2Gi
        volumeMounts:
        - name: redis-data
          mountPath: /data
        - name: redis-tmp
          mountPath: /tmp
        - name: redis-config
          mountPath: /usr/local/etc/redis
        livenessProbe:
          exec: { command: ["redis-cli", "--raw", "incr", "ping"] }
          initialDelaySeconds: 15  # Reduced for faster detection
          periodSeconds: 5         # More frequent checks
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          exec: { command: ["redis-cli", "ping"] }
          initialDelaySeconds: 5   # Reduced for faster readiness
          periodSeconds: 2         # More frequent checks
          timeoutSeconds: 2
          failureThreshold: 2
        startupProbe:
          exec: { command: ["redis-cli", "ping"] }
          initialDelaySeconds: 5
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 30
      volumes:
      - name: redis-tmp
        emptyDir: {}
      - name: redis-config
        emptyDir: {}
      terminationGracePeriodSeconds: 30
  volumeClaimTemplates:
  - metadata:
      name: redis-data
      labels:
        app: redis
        component: storage
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: gp3-ultra-performance  # Use ultra-performance storage
      resources:
        requests:
          storage: 200Gi  # Increased from 100Gi for better performance
---
# High-Availability Elasticsearch Cluster - Optimized for Performance and Resilience
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: sandee-production
  labels:
    app: elasticsearch
    component: search
    performance-tier: ultra
spec:
  serviceName: elasticsearch
  replicas: 3  # Changed from 1 to 2 for high availability
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
        component: search
        performance-tier: ultra
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9200"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: elasticsearch
            topologyKey: kubernetes.io/hostname
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values: ["m6i.xlarge", "m6i.2xlarge", "m6i.4xlarge"]
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: elasticsearch
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: increase-vm-max-map-count
        image: busybox:1.36
        command: ["sysctl", "-w", "vm.max_map_count=262144"]
        securityContext:
          privileged: true
      - name: increase-fd-ulimit
        image: busybox:1.36
        command: ["sh", "-c", "ulimit -n 65536"]
        securityContext:
          privileged: true
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3  # Updated to latest stable
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
          runAsNonRoot: true
          runAsUser: 1000
        env:
        - name: cluster.name
          value: "sandee-es-cluster"
        - name: node.name
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: discovery.seed_hosts
          value: "elasticsearch-0.elasticsearch.sandee-production.svc.cluster.local,elasticsearch-1.elasticsearch.sandee-production.svc.cluster.local,elasticsearch-2.elasticsearch.sandee-production.svc.cluster.local"
        - name: cluster.initial_master_nodes
          value: "elasticsearch-0,elasticsearch-1,elasticsearch-2"
        - name: xpack.security.enabled
          value: "false"
        - name: xpack.security.enrollment.enabled
          value: "false"
        - name: ES_JAVA_OPTS
          value: "-Xms2g -Xmx2g -XX:+UseG1GC -XX:G1HeapRegionSize=16m -XX:+UseStringDeduplication"  # Optimized for memory buffer requirements
        - name: index.number_of_replicas
          value: "1"  # Changed from 0 for data redundancy
        - name: index.number_of_shards
          value: "3"
        - name: bootstrap.memory_lock
          value: "true"
        - name: cluster.routing.allocation.disk.threshold_enabled
          value: "true"
        - name: cluster.routing.allocation.disk.watermark.low
          value: "85%"
        - name: cluster.routing.allocation.disk.watermark.high
          value: "90%"
        - name: cluster.routing.allocation.disk.watermark.flood_stage
          value: "95%"
        - name: indices.memory.index_buffer_size
          value: "20%"
        - name: indices.queries.cache.size
          value: "20%"
        - name: thread_pool.write.queue_size
          value: "1000"
        - name: thread_pool.search.queue_size
          value: "1000"
        ports:
        - containerPort: 9200
          name: http
          protocol: TCP
        - containerPort: 9300
          name: transport
          protocol: TCP
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 2Gi
        volumeMounts:
        - name: es-data
          mountPath: /usr/share/elasticsearch/data
        - name: es-tmp
          mountPath: /tmp
        - name: es-logs
          mountPath: /usr/share/elasticsearch/logs
        livenessProbe:
          httpGet:
            path: /_cluster/health?local=true
            port: 9200
          initialDelaySeconds: 60  # Reduced from 90
          periodSeconds: 20        # Reduced from 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /_cluster/health?wait_for_status=yellow&timeout=5s
            port: 9200
          initialDelaySeconds: 30  # Reduced from 60
          periodSeconds: 10        # Reduced from 15
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /_cluster/health?local=true
            port: 9200
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
      volumes:
      - name: es-tmp
        emptyDir: {}
      - name: es-logs
        emptyDir: {}
      terminationGracePeriodSeconds: 120  # Increased for graceful shutdown
  volumeClaimTemplates:
  - metadata:
      name: es-data
      labels:
        app: elasticsearch
        component: storage
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: gp3-ultra-performance  # Use ultra-performance storage
      resources:
        requests:
          storage: 300Gi  # Increased from 100Gi for better performance
---
# High-Performance Frontend Deployment - Optimized for Scale and Speed
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandee-frontend
  namespace: sandee-production
  labels:
    app: sandee-frontend
    component: frontend
    performance-tier: ultra
spec:
  replicas: 8
  revisionHistoryLimit: 3  # Reduced for efficiency
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 100%  # Increased from 25% for faster deployments
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sandee-frontend
  template:
    metadata:
      labels:
        app: sandee-frontend
        component: frontend
        performance-tier: ultra
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30  # Reduced from 45 for faster scaling
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule  # Stronger constraint for better distribution
        labelSelector:
          matchLabels:
            app: sandee-frontend
      - maxSkew: 2
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: sandee-frontend
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: sandee-frontend
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values: ["m6i.xlarge", "m6i.2xlarge", "m6i.4xlarge"]
      containers:
      - name: frontend
        image: 838645860193.dkr.ecr.us-east-1.amazonaws.com/frontend:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: NEXT_PUBLIC_DEV_BASE_URL
          value: "http://sandee-backend:8008"
        - name: NODE_OPTIONS
          value: "--max-old-space-size=2048"  # Restored to working value for stability
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: NEXT_TELEMETRY_DISABLED
          value: "1"
        - name: UV_THREADPOOL_SIZE
          value: "16"  # Increased thread pool for better I/O performance
        resources:
          requests:
            cpu: 300m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
        lifecycle:
          preStop:
            exec: { command: ["sh", "-c", "sleep 5"] }  # Reduced for faster scaling
        startupProbe:
          httpGet:
            path: /health
            port: 3000
            httpHeaders:
            - name: User-Agent
              value: "k8s-startup-probe"
          failureThreshold: 20  # Reduced from 30
          periodSeconds: 2
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
            httpHeaders:
            - name: User-Agent
              value: "k8s-liveness-probe"
          initialDelaySeconds: 30  # Reduced from 40
          periodSeconds: 15        # Reduced from 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
            httpHeaders:
            - name: User-Agent
              value: "k8s-readiness-probe"
          initialDelaySeconds: 10  # Reduced from 20
          periodSeconds: 5         # Reduced from 10
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: nextjs-cache
          mountPath: /.next
        - name: npm-cache
          mountPath: /.npm
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      - name: nextjs-cache
        emptyDir:
          sizeLimit: 2Gi
      - name: npm-cache
        emptyDir:
          sizeLimit: 500Mi
      dnsPolicy: ClusterFirst
      restartPolicy: Always
---
